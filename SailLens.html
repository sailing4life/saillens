<style>

:root{--bg:#edf1f4;--surface:#ffffff;--surface2:#f6f8fa;--ink:#0d1b2a;--ink2:#40526a;--muted:#77879a;--grid:#e6ebf0;--line:#d2dae3;--accent:#0a7a8c;--accent-ink:#ffffff;--hl:#fff1b8;--water:#eef5f9;

--side:#070c12;--side-ink:#b9c8d6;--side-mut:#60748a;--side-act:#13212e;
--port:#e66767;--stbd:#0ca30c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
--seq0:#22364f;--seq1:#9ccbff;--div-lo:#d95926;--div-mid:#6c7889;--div-hi:#3987e5;--good:#3fbf7f;--warn:#e0a03a;--bad:#ef6b6b;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1017;--surface:#121b25;--surface2:#172230;--ink:#e7edf3;--ink2:#b1bfce;--muted:#7d8da2;--grid:#223042;--line:#2b3a4d;--accent:#3fc1d3;--accent-ink:#06222a;--hl:#4a4212;--water:#0f1b26;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);display:grid;grid-template-columns:212px minmax(0,1fr);height:auto;min-height:100%}
[hidden]{display:none!important}
/* sidebar */
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:2px;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font:600 20px/1 var(--disp);letter-spacing:.03em;color:#fff}
.brand b span{color:#4fd0e0}

aside button.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:7px;padding:7px 10px;font:inherit;color:var(--side-ink);cursor:pointer;text-align:left}
aside button.nav svg{width:16px;height:16px;flex:none;opacity:.75}
aside button.nav:hover{background:var(--side-act);color:#fff}
aside button.nav[aria-selected="true"]{background:var(--side-act);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #4fd0e0}

aside .foot button{background:none;border:1px solid #2a4055;color:var(--side-ink);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
/* workspace */
.work{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px))}
.topbar h2{margin:0;font:600 20px/1.1 var(--disp);letter-spacing:.01em}
.topbar .sp{flex:1}
.chip{font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;white-space:nowrap}
.chip.demo{border-color:var(--s4);background:var(--hl);color:var(--ink)}
.chip.dirty{border-color:var(--warn);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:none;padding:6px 12px;font:inherit;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{opacity:.45;cursor:default}
main{padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1640px;width:100%}
#banner{background:var(--hl);border:1px solid var(--s4);border-radius:8px;padding:8px 12px;margin-bottom:14px}
#banner.bad{border-color:var(--bad)}
.tabpane{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:11px}
.card>h3{margin:0;font:600 16px/1.2 var(--disp);letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font:600 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4px;padding:3px 5px}
h4{margin:10px 0 2px;font:600 11.5px/1.2 var(--font);color:var(--ink2);text-transform:uppercase;letter-spacing:.07em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:14px}
.grid2>div,.cols>div,.cols>section{min-width:0}
.card.hero{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--side) 0%,#16405a 100%);color:#fff;border:0}
.card.hero h3.big{margin:0;font:600 28px/1.15 var(--disp);letter-spacing:.01em;color:#fff}

.card.hero button{background:transparent;color:#fff;border-color:#4b6b82}
.card.hero button.primary{background:#4fd0e0;border-color:#4fd0e0;color:#06222a}
.card.hero button:disabled{opacity:.5;cursor:default}
.homegrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
ul.heads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.heads li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--grid);line-height:1.45}
ul.heads li:last-child{border-bottom:0}
ul.heads .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--muted)}
ul.heads li.good .dot{background:var(--good)}ul.heads li.warn .dot{background:var(--warn)}ul.heads li.bad .dot{background:var(--bad)}
.card ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi span{font:600 10.5px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:600 27px/1.15 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi em{font-style:normal;font-size:12px;color:var(--ink2)}
.kpi.good b{color:var(--good)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--ink2);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
select,input:not([type]),input[type=text],input[type=number],input[type=datetime-local],textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

button.mini{padding:2px 7px;font-size:12px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.filerow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--grid);padding-top:9px}
.filerow input{max-width:260px}
.muted{color:var(--muted);font-size:12.5px;margin:0}
.b{font-weight:600}
.insight{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:9px 13px;margin:0}
ul.insight{padding-left:30px}ul.insight li+li{margin-top:4px}
.verdict{font-weight:600}.verdict.good{color:var(--good)}.verdict.warn{color:var(--warn)}.verdict.bad{color:var(--bad)}
.scroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--grid);padding:4px 9px;text-align:left;white-space:nowrap}
.tbl th{background:var(--surface2);font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line)}
.tbl.num td{text-align:right}.tbl.num td:first-child{text-align:left}
.tbl.kv td:first-child{color:var(--ink2);font-weight:600}.tbl.kv thead{display:none}
.tbl.bins td{text-align:center;min-width:44px;border:1px solid var(--grid)}
.tbl td.hl{background:var(--hl)}
.tbl input,.tbl select{padding:3px 6px;font-size:12.5px}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
button.sort{border:0;background:none;padding:0;font-weight:600;color:var(--ink2)}
canvas{display:block;width:100%}
canvas.map{border:1px solid var(--line);border-radius:8px;cursor:grab;touch-action:none}
canvas.strip{cursor:crosshair;touch-action:none}
.chartgrid{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;align-items:start}
.polgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(min(300px,100%),1fr);gap:16px;align-items:start}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.readouts div{background:var(--side);color:#fff;border-radius:8px;padding:7px 10px;display:flex;flex-direction:column}
.readouts .wide{grid-column:1/-1}
.readouts span{font:600 10px/1.3 var(--font);text-transform:uppercase;letter-spacing:.1em;color:#7f97ad}
.readouts b{font:600 24px/1.15 var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
input[type=range]{width:100%;accent-color:var(--accent)}
.striprow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);align-items:center}
.legend span,.legend button{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend i.tri{width:0;height:0;border-radius:0;background:none!important;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid}
.legend button.lg{padding:2px 8px;font-size:12px}.legend button.off{opacity:.4;text-decoration:line-through}
.rbar{width:120px;height:9px;background:var(--grid);border-radius:3px}.rbar i{display:block;height:100%;border-radius:3px}
.sailchips{display:flex;flex-wrap:wrap;gap:6px}
.sailchips span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;background:var(--surface2)}
.sailchips em{font-style:normal;color:var(--muted);font-size:11px}
.sailchips button{border:0;background:none;padding:0 6px;color:var(--muted)}
.tip{position:fixed;z-index:20;pointer-events:none;background:#0d1b2a;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:340px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25)}
body.drop::after{content:"Drop log, event, polar or season files";position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--surface) 86%,transparent);display:grid;place-items:center;font:600 22px var(--disp);z-index:30}
.report{background:var(--surface);border:1px solid var(--line);padding:30px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.report h1{font:600 32px/1.1 var(--disp);margin:0}.report h2{font:600 18px/1.2 var(--disp);margin:0 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.rsec{display:flex;flex-direction:column;gap:8px}

@media (max-width:900px){body{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:4px}aside h6,aside .foot span{display:none}#nav{display:flex;gap:4px}aside .foot{margin:0;padding:0;flex-direction:row}.brand{padding:0 8px 0 2px}aside button.nav{width:auto;white-space:nowrap}.chartgrid,.polgrid,.homegrid{grid-template-columns:minmax(0,1fr)}.topbar{position:static}}
@media print{aside,.topbar,.noprint,#banner,.tabpane:not(#t-report),.tip{display:none!important}body{background:#fff;display:block}main{padding:0;max-width:none}.report{border:0;padding:0;width:auto!important}.rsec{break-inside:avoid}textarea.note{border:0}textarea.note:placeholder-shown{display:none}.scroll{overflow:visible}.card,.kpi{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
/* Boat workspace and the four-step session workflow. */
.wf-hero,.wf-pagehead{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:18px 0 10px}
.wf-hero h1,.wf-pagehead h1{font:600 clamp(24px,3vw,38px)/1.12 var(--disp);letter-spacing:-.02em;margin:10px 0}
.eyebrow{font:600 11px var(--font);letter-spacing:.12em;color:var(--accent)}
.wf-boats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px}

.wf-subnav{gap:6px}.wf-subnav button{font-size:12px}
.wf-drop{border:1px dashed var(--accent);border-radius:9px;padding:28px;background:var(--surface2);display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.wf-drop input{max-width:100%}
.wf-selection{padding:14px 16px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.wf-selection .muted{margin-bottom:0;font-size:12px}

.wf-timeviews>div{min-width:0}.wf-map,.wf-strip{display:block;width:100%;touch-action:none;border-radius:8px}
.wf-models{display:flex;flex-direction:column;gap:16px}
.wf-note{border-left:2px solid var(--accent);padding:10px 16px;background:var(--surface2);border-radius:4px;margin-top:12px}
details{padding:12px 0}summary{cursor:pointer;font-weight:600;min-height:32px}details[open] summary{margin-bottom:12px}
.topbar{flex-wrap:wrap}.topbar #wf-save{font-size:11px}.wf-models .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
button,input,select{min-height:36px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:900px){.wf-hero,.wf-pagehead{align-items:flex-start}.wf-steps button{padding:10px 8px;gap:6px;font-size:13px}main{padding:16px}.wf-flow{margin-bottom:12px}.topbar{gap:6px}aside{max-width:100vw}#nav{min-width:max-content}aside .foot{margin-left:auto}}
@media(max-width:540px){.wf-steps{gap:4px}.wf-steps button{flex-direction:column;gap:5px;text-align:center;font-size:11px}.wf-steps button span{width:20px;height:20px;font-size:10px}.wf-hero,.wf-pagehead{flex-direction:column;gap:8px}.wf-selection .bar{align-items:stretch}.wf-selection .field{flex:1 1 140px}.wf-selection input{width:100%;min-width:0}.form{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.wf-drop{padding:18px}.wf-subnav{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:3px 0}.wf-subnav button{white-space:nowrap;flex:none}.brand b{font-size:16px}.topbar #status{max-width:100%;white-space:normal}.wf-boats .bar button{flex:1}button{min-height:40px}main{padding:12px}.card{padding:16px}}
@media print{.wf-flow{display:none!important}.report{max-width:100%}.wf-note{break-inside:avoid}}

.prep-steps{grid-template-columns:repeat(5,minmax(0,1fr))}.report-add{align-self:flex-start;border-color:var(--accent);color:var(--accent);margin-top:10px}.report-image{display:block;width:100%;height:auto;object-fit:contain}.event-strip{width:100%;display:block;touch-action:none}.studio-report{width:100%}.studio-report-item{border-top:1px solid var(--line);padding-top:18px}.studio-report-item .note{min-height:72px}.studio-report-item .bar{flex-wrap:wrap}.wf-flow>.bar{justify-content:flex-start;align-items:center}.wf-flow>.bar .eyebrow{margin-right:auto}.prep-steps button{padding:10px 8px;font-size:13px}.prep-steps button span{flex:none}@media(max-width:650px){.prep-steps{display:flex;overflow-x:auto}.prep-steps button{min-width:120px;flex:1}.wf-timeviews{grid-template-columns:minmax(0,1fr)}.studio-report{padding:16px}.wf-selection input{max-width:100%}}@media print{.report-add,.studio-report-item .noprint{display:none!important}.report-image{max-height:80vh;object-fit:contain}.studio-report{padding:0;border:0}}
/* The track, working list and time chart share the available laptop viewport. */
.prep-desk{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,34%,540px);grid-template-rows:minmax(0,1fr) clamp(132px,19vh,190px);gap:8px;min-width:0;min-height:0;flex:1}
.prep-desk.desk-pair{grid-template-rows:minmax(0,1fr) clamp(175px,26vh,250px)}
.desk-spatial,.desk-side,.desk-time{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0}
.desk-spatial,.desk-time{display:flex;flex-direction:column;overflow:hidden}

  const rows = []; for (const g of ct) { for (const r of g.rows) rows.push([{ t: g.mode, c: 'b' }, { t: r.tack, s: 'background:' + alpha(css(r.tack === 'Port' ? '--port' : '--stbd'), 0.18) }, r.n].concat(keys.map(k => f1(r[k], k === 'BSP' || k === 'SOG' || k === 'BSP-SOG' ? 2 : 1)))); if (g.rows.length === 2) rows.push(['', { t: 'Δ P−S', c: 'b' }, ''].concat(keys.map(k => ({ t: /HDG$|COG$/.test(k) && k !== 'HDG-COG' ? '' : k === 'CUR_DIR' ? f1(SL.w180(g.rows[0][k] - g.rows[1][k]), 0) : f1(g.rows[0][k] - g.rows[1][k], 2), c: 'b' })))); }
  c.append(h('h4', {}, 'Boat speed: port vs starboard'), table(['Mode', 'Tack', '#Ph'].concat(keys), rows, 'num'), h('p', { class: 'muted' }, 'BSP−SOG that differs by tack points at a paddle-wheel offset or heel correction; an equal offset on both tacks is current or a BSP scale error. HDG−COG mirrors leeway plus current.'));
  const aw = SL.awaTable(D, off || 0); if (aw.some(Boolean)) {
    const r2 = []; for (let k = 0; k < 4; k += 2) { const a = aw[k], b = aw[k + 1]; for (const x of [a, b]) if (x) r2.push([{ t: x.lab, c: 'b' }, x.n, f1(x.oAWA), { t: f1(x.nAWA), c: 'hl' }, f1(x.oTWS), { t: f1(x.nTWS), c: 'hl' }, f1(x.oTWA), { t: f1(x.nTWA), c: 'hl' }]); if (a && b) r2.push([{ t: 'delta', c: 'b' }, '', f1(a.oAWA - b.oAWA), { t: f1(a.nAWA - b.nAWA), c: 'hl b' }, f1(a.oTWS - b.oTWS), { t: f1(a.nTWS - b.nTWS), c: 'hl b' }, f1(a.oTWA - b.oTWA), { t: f1(a.nTWA - b.nTWA), c: 'hl b' }]); }
    c.append(h('h4', {}, 'AWA offset check (offset ' + f1(off || 0) + '°)'), table(['', '#Ph', 'old AWA', 'new AWA', 'old TWS', 'new TWS', 'old TWA', 'new TWA'], r2, 'num'), h('p', { class: 'muted' }, 'True wind is recomputed here from AWA, AWS and BSP only (no leeway or upwash tables), so compare old against new, not against the logged TWA. A positive offset increases AWA on starboard tack.'));
  }
  const sc = scale('ΔTWD', [8]), g = h('div', { class: 'cols' }); c.append(h('h4', {}, 'Wand offset and upwash, manoeuvre by manoeuvre'), g);
  for (const [ty, lab] of [['Tack', 'Upwind: across each tack'], ['Gybe', 'Downwind: across each gybe']]) { const r = SL.twdPairs(D, ty, off ? off : null); if (!r.length) { g.append(h('div', {}, h('p', { class: 'muted' }, lab + ': no usable pairs.'))); continue; }
    const m = k => SL.mean(r.map(x => x[k])), rr = r.map(x => [tstr(iT(x.i)), f1(x.tws), f1(x.awaP), f1(x.awaS), { t: f1(x.awaP - x.awaS), s: heat(x.awaP - x.awaS, sc) }, f1(x.twaP), f1(x.twaS), { t: f1(x.twaP - x.twaS), s: heat(x.twaP - x.twaS, sc) }, f1(x.P), f1(x.S), { t: f1(x.d), s: heat(x.d, sc) }]);
    rr.push([{ t: 'Mean', c: 'b' }, { t: f1(m('tws')), c: 'b' }, { t: f1(m('awaP')), c: 'b' }, { t: f1(m('awaS')), c: 'b' }, { t: f1(m('awaP') - m('awaS')), c: 'b' }, { t: f1(m('twaP')), c: 'b' }, { t: f1(m('twaS')), c: 'b' }, { t: f1(m('twaP') - m('twaS')), c: 'b' }, { t: f1(SL.cmean(r.map(x => x.P))), c: 'b' }, { t: f1(SL.cmean(r.map(x => x.S))), c: 'b' }, { t: f1(m('d')), c: 'b' }]);
    g.append(h('div', {}, h('p', { class: 'b' }, lab), table(['Time', 'TWS', 'AWA port', 'AWA stbd', 'ΔAWA', 'TWA port', 'TWA stbd', 'ΔTWA', 'TWD port', 'TWD stbd', 'ΔTWD'], rr, 'num'))); }
}

'use strict';
const CalibrationPlots = (() => {
  function render(container, diagnostic, view = {}) {
    const speed = diagnostic.kind === 'speed';
    const variable = speed ? 'SOG − BSP' : 'HDG − COG';
    const unit = speed ? 'kn' : '°';
    const signed = value => {
      if (!fin(value)) return '—';
      const rounded = Number(value.toFixed(speed ? 2 : 1));
      return (rounded > 0 ? '+' : '') + rounded.toLocaleString('nl-NL', {
        minimumFractionDigits: speed ? 2 : 1, maximumFractionDigits: speed ? 2 : 1
      });
    };
    const side = value => ({Port:'BB', Stbd:'SB', Starboard:'SB'})[value] || value || '—';
    const rows = diagnostic.rows.filter(r => fin(r.t) && (fin(r.raw) || fin(r.corrected)));
    const source = value => ({model:'Stroommodel', manual:'Handmatig', logged:'Gelogde stroom'})[value] || value || '';
    const axes = speed
      ? [{key:'bsp', label:'BSP (kn)'}, {key:'t', label:'Sessietijd'}]
      : [{key:'heading', label:'Heading (°)'}, {key:'t', label:'Sessietijd'}];
    const heelAxis = {key:'heel', label:'Helling (°)'};
    if (!speed && rows.some(r => fin(r.heel))) axes.push(heelAxis);
    const correctedCount = rows.filter(r => fin(r.corrected)).length;
    const rawCount = rows.filter(r => fin(r.raw)).length;
    const panel = card(variable + ' per referentievenster');
    panel.id = 'cal-delta-' + diagnostic.kind;
    container.append(panel);
    if (diagnostic.reference) panel.append(h('p', {class:'muted'}, diagnostic.reference));
    if (diagnostic.issue) panel.append(h('p', {role:'status'}, diagnostic.issue));
    if (!rows.length) {
      if (!diagnostic.issue) panel.append(h('p', {}, 'Keur een stabiele fase of een manoeuvrepaar met ' + variable.replace(' − ', ' en ') + ' goed voor kalibratie.'));
      return panel;
    }
    const charts = h('div', speed ? {
      style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px'
    } : {});
    function makeChart() {
      const title = h('h4', {hidden:!speed});
      const canvas = h('canvas', {role:'img'});
      const empty = h('p', {class:'muted', hidden:true});
      charts.append(h('div', {style:'min-width:0'}, title, canvas, empty));
      return {title, canvas, empty};
    }
    const mainChart = makeChart();
    const heelChart = speed ? makeChart() : null;
    const controls = h('div', {class:'legend', role:'group', 'aria-label':'Zichtbare reeksen'});
    const sets = [
      {key:'raw', label:'Zonder stroomcorrectie', color:css('--s1'), triangle:false, count:rawCount},
      {key:'corrected', label:'Met stroomcorrectie', color:css('--s2'), triangle:true, count:correctedCount}
    ];
    const availableAxes = axes.filter(axis => rows.some(r => fin(r[axis.key])));
    const choose = key => e => { view[key] = e.target.value; draw(); };
    const axis = h('select', {'aria-label':'Horizontale as', onchange:choose('axis')},
      availableAxes.map(a => h('option', {value:a.key, selected:a.key===view.axis}, a.label)));
    const sides = [...new Set(rows.map(r => side(r.side)))].filter(s => s !== '—');
    const tack = h('select', {'aria-label':'Boeg', onchange:choose('tack')},
      h('option', {value:''}, 'Beide boegen'), sides.map(s => h('option', {value:s, selected:s===view.tack}, s)));
    const sensors = speed ? [...new Set(rows.map(r => r.sensor).filter(Boolean))] : [];
    const showSensors = sensors.some(name => name === 'Bakboord' || name === 'Stuurboord');
    const sensor = h('select', {'aria-label':'BSP-sensor', onchange:choose('sensor')}, h('option', {value:''}, 'Alle sensoren'),
      sensors.map(name => h('option', {value:name, selected:showSensors && name===view.sensor}, name)));
    const axesBar = bar(field(speed ? 'Hoofdgrafiek' : 'Horizontale as', axis), sides.length > 1 ? field('Boeg', tack) : null,
      showSensors ? field('BSP-sensor', sensor) : null);
    const status = h('p', {class:'muted', role:'status'});
    for (const set of sets) {
      set.input = h('input', {type:'checkbox', 'data-series':set.key, checked:set.count > 0 && view[set.key] !== false,
        disabled:!set.count, onchange:e=>{view[set.key]=e.target.checked;draw();}});
      const marker = h('i', {'aria-hidden':'true', class:set.triangle ? 'tri' : '',
        style: set.triangle ? 'border-bottom-color:' + set.color : 'background:' + set.color + ';border-radius:50%'});
      set.caption = h('span', {}, set.label);
      controls.append(h('label', {style:'display:inline-flex;align-items:center;gap:5px;cursor:pointer'}, set.input, marker, set.caption));
    }
    panel.append(axesBar, controls, charts, status);

    // Keep the vertical range fixed across filters so the before/after comparison uses the same scale.
    let limit = speed ? .2 : 2;
    for (const r of rows) for (const set of sets) {
      if (fin(r[set.key])) limit = Math.max(limit, Math.abs(r[set.key]) * 1.08);
    }
    function selection() {
      return rows.filter(r => (!tack.value || side(r.side) === tack.value) && (!sensor.value || r.sensor === sensor.value));
    }
    function draw() {
      const selected = selection();
      for (const set of sets) set.caption.textContent = set.label + ' (' + selected.filter(r => fin(r[set.key])).length + ')';
      const visible = sets.filter(set => set.input.checked);
      const hasValue = selected.some(r => visible.some(set => fin(r[set.key])));
      drawChart(mainChart, axes.find(a => a.key === axis.value), selected, visible);
      if (heelChart) drawChart(heelChart, heelAxis, selected, visible);
      updateTable();
      if (!hasValue) {
        status.textContent = visible.length ? 'Geen meetwaarden voor deze selectie.' : 'Selecteer een reeks om de grafiek te tonen.';
        return;
      }
      status.textContent = speed
        ? 'Boven nul leest BSP lager dan de gekozen GPS-snelheidsreferentie.'
        : 'Boven nul ligt de heading met de klok mee ten opzichte van de gekozen koersreferentie. Leeway kan bijdragen aan dit verschil.';
    }
    function drawChart(chart, dimension, selected, visible) {
      const {key:x, label} = dimension;
      const cv = chart.canvas;
      cv.dataset.axis = x;
      cv.setAttribute('aria-label', variable+' ('+unit+') tegen '+label+'. Meetwaarden staan in de venstertabel.');
      chart.title.textContent = 'Restfout tegen '+({bsp:'bootsnelheid',t:'sessietijd',heel:'helling',heading:'heading'})[x];
      const points = selected.filter(r => fin(r[x]) && visible.some(set => fin(r[set.key])));
      cv.hidden = !points.length;
      chart.empty.hidden = points.length > 0 || !visible.length || !selected.length;
      if (!points.length) {
        chart.empty.textContent = x === 'heel' ? 'Geen hellingmeting met een zichtbare restfout in deze vensters.' : 'Geen meetpunten voor deze as en reeks.';
        return;
      }
      const values = points.map(r => r[x]);
      const min = values.reduce((a,b) => Math.min(a,b)), max = values.reduce((a,b) => Math.max(a,b));
      const padding = Math.max(x === 't' ? 1000 : .2, (max-min)*.025);
      const bounds = x === 'heading' ? [0,360] : [x === 'bsp' ? Math.max(0,min-padding) : min-padding, max+padding];
      if (x === 'heel') {
        const extent = Math.max(1,Math.abs(min),Math.abs(max))+padding;
        bounds[0] = -extent;
        bounds[1] = extent;
      }
      const g = plot(cv, {h:225, pl:56, pr:22, xr:bounds, yr:[-limit, limit], xl:label, yl:variable + ' (' + unit + ')',
        xTickGap:x === 't' ? 85 : 65, xfmt:x === 't' ? t => max-min < 60000 ? tstr(t) : tstr(t).slice(0,5) : undefined});
      g.zero(0);
      for (const r of points) {
        const tip = [dstr(r.t), side(r.side), x !== 't' ? label + ' ' + f1(r[x],1) : '', showSensors && r.sensor ? 'BSP-sensor '+r.sensor : '', source(r.source),
          ...visible.filter(set => fin(r[set.key])).map(set => set.label + ' ' + signed(r[set.key]) + ' ' + unit)].filter(Boolean).join(' · ');
        for (const set of visible) g.dot(r[x], r[set.key], set.color, tip, null, set.triangle, set.triangle ? 3.3 : 4.6);
      }
    }
    const summary = h('summary');
    const details = h('details', {}, summary);
    function updateTable() {
      if (!details.isConnected) return;
      const selected = selection();
      summary.textContent = 'Meetwaarden per venster (' + selected.length + ')';
      if (!details.open) return;
      const additionalAxis = axes.find(a => a.key === axis.value && a.key !== 't');
      const showHeel = speed && selected.some(r => fin(r.heel));
      const hasSource = selected.some(r => r.source);
      const hasCurrent = selected.some(r => fin(r.currentSet) || fin(r.currentDrift));
      details.replaceChildren(summary, table(['Sessietijd', 'Boeg', ...(showSensors ? ['BSP-sensor'] : []), ...(additionalAxis ? [additionalAxis.label] : []), ...(showHeel ? [heelAxis.label] : []), ...(hasSource ? ['Stroombron'] : []),
        ...(hasCurrent ? ['Set (°T)', 'Drift (kn)'] : []), 'Zonder stroomcorrectie (' + unit + ')', 'Met stroomcorrectie (' + unit + ')'],
        selected.map(r => [dstr(r.t), side(r.side), ...(showSensors ? [r.sensor || '—'] : []), ...(additionalAxis ? [f1(r[axis.value],1)] : []), ...(showHeel ? [f1(r.heel,1)] : []),
          ...(hasSource ? [source(r.source) || '—'] : []), ...(hasCurrent ? [f1(r.currentSet,0), f1(r.currentDrift,2)] : []), signed(r.raw), signed(r.corrected)])));
    }
    details.addEventListener('toggle', updateTable);
    panel.append(details);
    draw();
    return panel;
  }
  return {render};
})();

'use strict';
const WindPlots = (() => {
  const fmt=(v,d=1)=>fin(v)?v.toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
  const deg=v=>fin(v)?fmt(v)+'°':'—';
  const signed=v=>fin(v)?(v>=.05?'+':'')+deg(v):'—';
  const sailLabel=s=>s&&s!=='-'?s:'Onbekend zeil';
  const pageSize=7;

  function barChart(grid,type,pairs,key,series,limit,onOpenPair) {
    const rows=pairs.filter(p=>p.type===type&&fin(p[series][key]));
    const fit=rows.filter(p=>!p.validation).map(p=>p[series][key]);
    const median=SL.median(fit), title=type==='Tack'?'Tacks':'Gijpen';
    const frame=h('section',{class:'windplot-frame'},h('h4',{},title+' · '+(key==='TWD'?'ΔTWD':'Δ|'+key+'|')));
    grid.append(frame);
    if(!rows.length){frame.append(h('p',{class:'muted'},'Geen '+title.toLowerCase()+' met bruikbare '+key+' in deze selectie.'));return;}
    frame.append(h('div',{class:'windplot-meta'},'Mediaan '+signed(median)+' · '+fit.length+' paren (excl. controle)'));
    const bars=h('div',{class:'windplot-bars'}),pager=h('div',{class:'windplot-pager'});
    frame.append(h('div',{class:'windplot-axis','aria-hidden':'true'},h('span',{class:'windplot-scale'},['−'+fmt(limit,0)+'°','0°','+'+fmt(limit,0)+'°'].map(v=>h('span',{},v)))),bars,pager);
    let page=0;
    function display(){
      const start=page*pageSize;
      bars.replaceChildren();
      for(const row of rows.slice(start,start+pageSize)){
        const value=row[series][key],fraction=50*value/limit;
        const description=title+' · '+dstr(row.t)+' · '+sailLabel(row.sail)+' · '+signed(value)+(row.validation?' · Controlepaar':'');
        const attrs={class:'windplot-row',title:description,'aria-label':description+(onOpenPair?' · Open paar':'')};
        const track=h('span',{class:'windplot-track','aria-hidden':'true'},
          h('span',{class:'windplot-bar',style:'left:'+Math.min(50,50+fraction)+'%;width:'+Math.abs(fraction)+'%;background:var('+(value<0?'--stbd':'--port')+')'}),
          fin(median)?h('i',{class:'windplot-median',style:'left:'+(50+50*median/limit)+'%'}):null);
        bars.append(h(onOpenPair?'button':'div',onOpenPair?{...attrs,type:'button',onclick:()=>onOpenPair(row.key)}:attrs,
          h('span',{},tstr(row.t)+(row.validation?' *':'')),track,h('span',{},signed(value))));
      }
      pager.replaceChildren();
      if(rows.length>pageSize){
        const move=(label,offset,disabled)=>h('button',{type:'button',disabled,'aria-label':label+' '+title.toLowerCase(),
          onclick:()=>{page+=offset;display();}},label);
        pager.append(move('Vorige',-1,page===0),h('span',{'aria-live':'polite'},(start+1)+'–'+Math.min(rows.length,start+pageSize)+' van '+rows.length),move('Volgende',1,start+pageSize>=rows.length));
      }
    }
    display();
  }

  function scatter(grid,mode,phases,channel,series,xr,colorBySail,colorForSail){
    const points=phases.filter(p=>p.mode===mode&&fin(p[series].TWS)&&fin(p[series][channel]));
    const heading=(mode==='up'?'Aandewindse':'Voor-de-windse')+' fases · |'+channel+'|';
    const frame=h('section',{class:'windplot-frame'},h('h4',{},heading));
    grid.append(frame);
    if(!points.length){frame.append(h('p',{class:'muted'},'Geen fases met bruikbare '+channel+' en TWS in deze selectie.'));return;}
    const canvas=h('canvas',{role:'img','aria-label':heading+' tegen TWS. Waarden staan in de fasetabel hieronder.'});
    frame.append(canvas);
    const angle=p=>p[series][channel];
    const yr=[Math.max(0,Math.floor(SL.quant(points.map(angle),0))-2),Math.min(180,Math.ceil(SL.quant(points.map(angle),1))+2)];
    const groups=new Map();
    for(const p of points){
      const k=JSON.stringify([p.sail,p.side]);
      if(!groups.has(k))groups.set(k,[]);
      groups.get(k).push(p);
    }
    const tint=p=>colorBySail?colorForSail(p.sail):css(p.side==='Port'?'--port':'--stbd');
    const fits=[];
    for(const group of groups.values()){
      if(group.length<4)continue;
      const xs=group.map(p=>p[series].TWS);
      if(SL.quant(xs,1)-SL.quant(xs,0)<1||new Set(xs).size<3)continue;
      fits.push([SL.fitTrend(xs,group.map(angle),'Straight line',2),tint(group[0]),group[0].side]);
    }
    function paint(){
      const g=plot(canvas,{w:canvas.clientWidth||undefined,h:183,xr,yr,xl:'TWS (kn)',yl:'|'+channel+'| (°)',pl:47,xTickGap:55});
      for(const [line,color,tack] of fits){
        g.c.setLineDash(colorBySail&&tack==='Stbd'?[4,3]:[]);
        g.line(line,color,1.4);
      }
      g.c.setLineDash([]);
      for(const p of points)g.dot(p[series].TWS,angle(p),tint(p),
        [dstr(p.t),sailLabel(p.sail),p.side==='Port'?'BB':'SB',fmt(p[series].TWS)+' kn',deg(angle(p))].join(' · '),null,p.side==='Stbd',3);
    }
    paint();
    if(typeof ResizeObserver==='function'){
      let width=frame.clientWidth;
      const observer=new ResizeObserver(()=>{
        if(!frame.isConnected){observer.disconnect();return;}
        if(frame.clientWidth>0&&frame.clientWidth!==width){width=frame.clientWidth;paint();}
      });
      observer.observe(frame);
    }
  }

  function expandable(parent,label,head,rows,toCells){
    const summary=h('summary',{},label+' ('+rows.length+')'),details=h('details',{},summary);
    parent.append(details);
    details.addEventListener('toggle',()=>{
      if(!details.open||details.childElementCount>1)return;
      details.append(table(head,rows.map(toCells)));
    });
  }

  function render(container,data,view={},onOpenPair=null,onSelectionChange=null){
    const mhu=data.kind==='mhu',id='windplot-'+(mhu?'mhu':'twa');
    const panel=card(mhu?'MHU-symmetrie':'TWA en TWD per boeg');
    panel.classList.add('windplot-panel');panel.id=id;container.append(panel);
    const controls=h('div',{class:'form'}),note=h('p',{class:'muted'}),plots=h('div');
    panel.append(controls,note,plots);
    const changed=(k,value)=>{view[k]=value;draw();};
    const select=(k,label,values,chosen)=>{
      const s=h('select',{id:id+'-'+k,onchange:e=>changed(k,e.target.value)},values.map(([value,text])=>h('option',{value,selected:value===chosen},text)));
      controls.append(field(label,s));return s;
    };
    if(!data.pairs.length&&!data.phases.length)panel.append(h('p',{class:'muted'},'Keur stabiele fases en vensters vóór en na een tack of gijp goed voor kalibratie.'));
    const channels=['AWA','TWA','MWA'].filter(k=>data.channels.includes(k));
    const angle=mhu?select('channel','Windhoek',(channels.length?channels:['AWA']).map(k=>[k,k]),view.channel||channels[0]):null;
    const series=select('series','Kalibratie',data.hasProposal?[['active','Actief'],['proposed','Voorstel']]:[['active','Actief']],view.series||(data.hasProposal?'proposed':'active'));
    const sails=[...new Set([...data.phases,...data.pairs].map(p=>p.sail))].sort((a,b)=>sailLabel(a).localeCompare(sailLabel(b),'nl'));
    const sail=select('sail','Zeilset',[['','Alle zeilsets'],...sails.map(s=>[s,sailLabel(s)])],view.sail||'');
    function bound(k,label){
      const input=h('input',{type:'number',id:id+'-'+k,min:0,step:'any',placeholder:'Vrij',value:view[k]??'',
        oninput:e=>changed(k,e.target.value===''?null:e.target.valueAsNumber)});
      controls.append(field(label,input));return input;
    }
    const lo=bound('min','Actieve TWS vanaf (kn)'),hi=bound('max','Actieve TWS t/m (kn)');
    const color=select('color','Puntkleur',[['side','Boeg'],['sail','Zeilset']],view.color||'side');
    const checks=h('input',{type:'checkbox',id:id+'-validation',checked:view.validation,onchange:e=>changed('validation',e.target.checked)});
    if(data.pairs.some(p=>p.validation))controls.append(field('Toon controleparen (*)',checks));
    function draw(){
      const channel=mhu?angle.value:'TWA',metric=mhu?channel:'TWD',version=series.value;
      const minTws=lo.value===''?null:lo.valueAsNumber,maxTws=hi.value===''?null:hi.valueAsNumber;
      const invalid=!lo.validity.valid||!hi.validity.valid||(minTws!==null&&maxTws!==null&&minTws>maxTws);
      function selected(p){
        return !invalid&&(!mhu||p.vmgToVmg!==false)&&(!sail.value||p.sail===sail.value)&&(minTws===null||(fin(p.tws)&&p.tws>=minTws))&&(maxTws===null||(fin(p.tws)&&p.tws<=maxTws));
      }

    const ev=evEnsure();for(const e of ev.events)e.id||=SL.uid();
    const {side,toolbar}=PrepDesk.mount(c,'Events · '+ev.events.length,{addEvent:()=>editor(ev)});
    toolbar.append(button('+ Event',()=>editor(ev),{class:'primary',title:'Event bij de cursor (E)'}));
    side.append(bar(...['RaceStartGun','RaceMark','RaceFinish','SailsUp'].map(k=>button(labels[k],()=>editor(ev,k))),button('Tijdvak markeren',()=>interval(ev))));
    const rows=ev.events.map(e=>{const t=logTime(e),pick=()=>{A.cur=Math.max(A.D.i0,Math.min(A.D.i1-1,Math.round((t-A.raw.t0)/1000)));if(WF.session.viewport&&(A.cur<WF.session.viewport[0]||A.cur>=WF.session.viewport[1]))WF.session.viewport=null;WF.session.deskEvent=e.id;show('events');};
      const row=[button(tstr(t),pick,{title:dstr(t)}),labels[e.type]||e.type,e.type==='SailsUp'?e.attr.split(';').filter(Boolean).join(' / ')||'Geen':e.attr&&e.attr!=='0'?e.attr:e.comments,button('Bewerk',()=>editor(ev,e.type,e))];
      row._attrs={'aria-selected':WF.session.deskEvent===e.id,title:e.comments||'',onclick:x=>{if(!x.target.closest('button'))pick();}};return row;});
    side.append(table(['Tijd','Event','Waarde',''],rows));
    if(!rows.length)side.append(h('p',{class:'muted'},'Klik op de track of tijdgrafiek en voeg het eerste event toe.'));
    const extra=h('details',{},h('summary',{},'Manoeuvre handmatig plaatsen'));side.append(extra);RaceTools.turnControls(extra);
    side.append(bar(button('Events exporteren',()=>dl('SailLens-events.ev.xml',SL.eventsXml(ev))),button('Ongedaan maken',()=>{const undo=WF.session.eventUndo,previous=undo.pop();try{commit(previous,false);}catch(e){undo.push(previous);banner(e.message,true);}},{disabled:!WF.session.eventUndo?.length})),button('Verder naar fases',()=>show('review'),{class:'primary'}));
  }
  return {render,context};
})();
